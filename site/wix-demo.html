<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ludos — teste isolado do componente</title><style>body{background:#fff6de;color:#264e3b;margin:0;padding:35px;font:16px system-ui}main{max-width:900px;margin:auto}ludos-scene{display:block;width:100%;height:480px;background:#d7dfbf;border-radius:25px;position:relative;overflow:hidden}canvas{display:block;width:100%;height:100%}button,select{font:inherit;padding:12px;margin:10px 10px 10px 0}label{display:block;margin:20px 0}input{width:100%}</style></head><body><main><h1>Componente Ludos isolado</h1><p>Ambiente local para verificar o contrato de atributos. Não comprova integração com o scroll do Wix.</p><ludos-scene layout="contained" scene-id="hero" motion-mode="full" aria-label="Composição 3D da marca Ludos"></ludos-scene><label>Cena <select id="scene"><option value="hero">Grupo</option><option value="universe">Edy</option><option value="space">Jr</option><option value="courses">Fred</option></select></label><label>Progresso externo <input type="range" min="0" max="1" step="0.01" value="0" /></label><button id="motion">Reduzir movimento</button><p id="status" role="status">Carregando…</p></main><script type="module">import './src/scene.js';const scene=document.querySelector('ludos-scene');document.querySelector('#scene').onchange=e=>scene.setAttribute('scene-id',e.target.value);document.querySelector('input').oninput=e=>scene.setAttribute('progress',e.target.value);document.querySelector('#motion').onclick=e=>{const reduced=scene.getAttribute('motion-mode')==='full';scene.setAttribute('motion-mode',reduced?'reduced':'full');e.target.textContent=reduced?'Ativar movimento':'Reduzir movimento'};scene.addEventListener('ludos-ready',()=>document.querySelector('#status').textContent='Componente carregado.');scene.addEventListener('ludos-error',()=>document.querySelector('#status').textContent='WebGL não disponível.');if(scene.querySelector('canvas'))document.querySelector('#status').textContent='Componente carregado.';</script></body></html>
